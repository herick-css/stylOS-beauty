<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Editor — StylOS Beauty</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <script src="/js/esquemas-secoes.js" defer></script>
  <script src="/js/icones.js" defer></script>
  <script src="/js/comum.js" defer></script>
  <script src="/js/tour.js" defer></script>
  <script src="/js/editor.js" defer></script>
</head>
<body>
  <div class="editor" id="editor">
    <header class="editor__topo" id="editor-topo"></header>
    <div class="editor__corpo" id="editor-corpo" data-aba="editar">
      <aside class="painel-edicao" id="painel-edicao" aria-label="Edição da página"></aside>
      <section class="area-previa" id="area-previa" aria-label="Prévia da página">
        <div class="moldura-previa" id="moldura-previa">
          <iframe id="previa" title="Prévia da página" src="/pre-visualizacao"></iframe>
        </div>
        <span class="escala-previa" id="escala-previa"></span>
      </section>
    </div>
    <nav class="abas-celular" id="abas-celular" role="tablist" aria-label="Alternar entre editar e prévia"></nav>
  </div>
</body>
</html>
