<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Foto de perfil do Gmail do StylOS Beauty (stylosbeauty26@gmail.com).
       Tudo fica dentro do círculo central: o Gmail recorta a foto em círculo. -->
  <defs>
    <radialGradient id="fundo" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#3a2d4d"/>
      <stop offset="0.55" stop-color="#211b2b"/>
      <stop offset="1" stop-color="#121016"/>
    </radialGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e2c0"/>
      <stop offset="0.45" stop-color="#e2bf8c"/>
      <stop offset="1" stop-color="#b8865a"/>
    </linearGradient>
    <linearGradient id="violeta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b6cf2"/>
      <stop offset="1" stop-color="#c99a6b"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b6cf2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b6cf2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#fundo)"/>
  <circle cx="512" cy="470" r="330" fill="url(#brilho)"/>
  <!-- arco (o mesmo das páginas do tema Lavanda) -->
  <path d="M302 690 V430 A210 210 0 0 1 722 430 V690" fill="none" stroke="url(#ouro)" stroke-width="5" opacity="0.9"/>
  <path d="M332 690 V436 A180 180 0 0 1 692 436 V690" fill="none" stroke="#e2bf8c" stroke-width="1.6" opacity="0.45"/>
  <line x1="282" y1="690" x2="742" y2="690" stroke="url(#ouro)" stroke-width="5" stroke-linecap="round"/>
  <!-- monograma -->
  <text x="512" y="642" text-anchor="middle" font-family="GFS Baskerville, Baskerville, Georgia, serif" font-style="italic" font-size="400" fill="url(#ouro)">S</text>
  <circle cx="640" cy="626" r="17" fill="#9b7fe6"/>
  <!-- nome -->
  <text x="512" y="780" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="76" letter-spacing="-2" fill="#ffffff">Styl<tspan fill="url(#violeta)">OS</tspan></text>
  <text x="512" y="836" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="30" letter-spacing="14" fill="#e2bf8c">BEAUTY</text>
